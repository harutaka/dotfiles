[tools]
bun = "latest"
edit = "latest"
go = "latest"
node = "lts"
"npm:tldr" = "latest"
python = "latest"
terraform = "latest"
uv = "latest"

[dotfiles]
"~/.vimrc" = { mode = "symlink" }
"~/.bashrc" = { mode = "symlink" }
"~/.gitconfig" = { mode = "symlink" }
"~/.zshrc" = { mode = "symlink" }

[settings]
minimum_release_age = "3d"

[settings.npm]
package_manager = "bun"
